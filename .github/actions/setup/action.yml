name: Setup
description: >-
  Shared CI bootstrap: pnpm (version from packageManager), Node from .nvmrc with the pnpm store
  cache, a frozen-lockfile install and the local Turborepo cache. Reused by every workflow job.

runs:
  using: composite
  steps:
    # No `version` input: the action reads `packageManager` from the root package.json.
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Install Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    # Remote cache is optional (TURBO_TOKEN/TURBO_TEAM); this local cache is the fallback.
    - name: Restore Turborepo cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-

    # LEFTHOOK=0: git hooks are a local-only concern; skip installing them in CI.
    - name: Install dependencies
      shell: bash
      env:
        LEFTHOOK: '0'
      run: pnpm install --frozen-lockfile
