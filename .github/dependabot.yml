version: 2
updates:
  # Versions live in the pnpm catalog (pnpm-workspace.yaml); bump them together in one PR.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      catalog:
        patterns: ['*']
  # Workflows plus the composite actions under .github/actions/.
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
