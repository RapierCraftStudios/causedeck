# End-to-end suites (#16): Playwright against a freshly built apps/web and the Compose dev stack,
# plus Lighthouse CI on /sign-in and the seeded courts pages. No secrets: every credential is a
# local dev default or generated in the job. See e2e/README.md.
#
# Playwright runs inside the pinned Playwright image (`docker run --network host`), so browsers and
# fonts are identical to the ones that generated the visual baselines; the job itself runs on the
# host because the Compose stack (infra/scripts/dev-up.sh, #5) needs Docker, which a `container:`
# job does not have. `services: postgres` is deliberately not used: the e2e harness needs the same
# init SQL, roles and Mailpit as local development.
name: E2E

on:
  # Ship tier (docs/engineering/ci.md, D-046): ship PRs into staging/main, pushes to main, or a PR
  # labelled `full-ci` run the `ship` scope (the blocking gate). The nightly schedule and manual
  # dispatch run the `full` matrix, report-only. Lane PRs into milestone/* skip it.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    # 02:00 IST: the flake hunt (`@smoke` x5, no retries).
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate the @visual baselines in the pinned image and open a PR with them
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep the tag in step with the `@playwright/test` catalog version (same digest as storybook.yml).
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  e2e:
    name: e2e (${{ matrix.shard }}/2)
    if: ${{ !inputs.update_snapshots && (github.event_name != 'pull_request' || github.base_ref == 'staging' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') }}
    runs-on: ubuntu-latest
    # Ship scope: about 340 browser tests over 2 shards, 12-25 min including the stack and the build (measured on PR #352).
    # Full scope (nightly/dispatch): the 6-project matrix plus visual specs, 90 min and report-only.
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 90 || 30 }}
    continue-on-error: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    env:
      E2E_SCOPE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'ship' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Start the Compose stack (Postgres, MinIO, Mailpit)
        run: bash infra/scripts/dev-up.sh
      # The image carries the pinned browsers, so nothing is downloaded at test time.
      - name: Pull the pinned Playwright image
        run: docker pull "$PLAYWRIGHT_IMAGE"
      - name: Playwright (shard ${{ matrix.shard }}/2)
        env:
          SHARD: ${{ matrix.shard }}
        run: >-
          docker run --rm --network host --ipc host
          -e CI=true -e E2E_ASSERT_RESET_MS=2000 -e E2E_SCOPE -e E2E_PERF=skip
          -v "$GITHUB_WORKSPACE:/work" -w /work/e2e "$PLAYWRIGHT_IMAGE"
          node support/playwright.mjs --shard="$SHARD/2"
      # The `@perf` timing specs run here, alone, once the shard's tests are done: beside a second
      # worker the matters list p95 roughly doubles (e2e/playwright.config.ts). They reuse the build
      # above, and write to their own results folder so the shard's artifacts are kept.
      - name: Playwright perf budgets (alone)
        if: ${{ !cancelled() && matrix.shard == 1 }}
        run: >-
          docker run --rm --network host --ipc host
          -e CI=true -e E2E_ASSERT_RESET_MS=2000 -e E2E_SCOPE -e E2E_PERF=only -e E2E_SKIP_BUILD=1
          -v "$GITHUB_WORKSPACE:/work" -w /work/e2e "$PLAYWRIGHT_IMAGE"
          node support/playwright.mjs --workers=1 --reporter=list,github --output=test-results-perf
      # Postgres diagnostics (ship PR #759: CONNECT_TIMEOUT stalls): connection counts by state and
      # the slow-statement and lock-wait log lines (compose.ci.yml). Report-only; never fails the job.
      - name: Postgres diagnostics
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          compose=(docker compose -f infra/docker/compose.dev.yml -f infra/docker/compose.ci.yml)
          "${compose[@]}" exec -T postgres psql -U causedeck -d postgres -c \
            "select datname, state, count(*) from pg_stat_activity group by 1, 2 order by 3 desc"
          "${compose[@]}" exec -T postgres psql -U causedeck -d postgres -Atc "show max_connections"
          "${compose[@]}" logs --no-color postgres | grep -E 'duration:|lock|FATAL|too many|checkpoint' | tail -n 200 || true
      - name: Upload the HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 14
      # Traces (first retry), videos and expected/actual/diff images of failed tests.
      - name: Upload traces and test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: |
            e2e/test-results
            e2e/test-results-perf
          if-no-files-found: ignore
          retention-days: 14

  lighthouse:
    name: lighthouse
    # Report-only (D-045): nightly, manual dispatch, or a PR labelled full-ci. Not a ship gate.
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.update_snapshots) || (contains(github.event.pull_request.labels.*.name, 'full-ci') && github.event.label.name == 'full-ci') || (contains(github.event.pull_request.labels.*.name, 'full-ci') && github.event.action != 'labeled') }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A real production build (the dev sign-in provider is compiled out) against the Compose
      # stack, migrated and seeded with the `e2e` profile (#427): /sign-in is audited signed out,
      # the courts pages signed in as the seeded owner, through a magic link read from Mailpit.
      # Local dev defaults and throwaway values only.
      NODE_ENV: production
      APP_URL: http://localhost:3100
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      API_URL: http://localhost:3101
      DATABASE_URL: postgres://causedeck_app:causedeck_app@127.0.0.1:5432/causedeck
      DATABASE_URL_OWNER: postgres://causedeck_owner:causedeck_owner@127.0.0.1:5432/causedeck
      ALLOW_MOCK_PROVIDERS: 'true'
      EMAIL_PROVIDER: smtp
      SMTP_URL: smtp://127.0.0.1:1025
      AI_PROVIDER: mock
      BILLING_PROVIDER: mock
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_BUCKET: causedeck-dev
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      AUTH_GOOGLE_ENABLED: 'false'
      SENTRY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Generate throwaway server secrets
        run: |
          echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >>"$GITHUB_ENV"
          echo "KEK_BASE64=$(openssl rand -base64 32)" >>"$GITHUB_ENV"
      - name: Start the Compose stack (Postgres, MinIO, Mailpit)
        run: bash infra/scripts/dev-up.sh
      - name: Migrate and seed (e2e profile)
        run: |
          pnpm --filter @causedeck/db db:migrate
          pnpm --filter @causedeck/db db:seed --profile e2e
      - name: Build apps/web (production)
        run: pnpm --filter @causedeck/web build
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-chromium-1.60.0
      - name: Install Chromium for Lighthouse
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'
        run: pnpm --filter @causedeck/e2e exec playwright install --with-deps chromium
      - name: Lighthouse CI (/sign-in, mobile; performance and accessibility >= 0.95)
        run: |
          CHROME_PATH=$(find ~/.cache/ms-playwright -path '*chrome-linux*/chrome' -type f | head -n 1)
          export CHROME_PATH
          pnpm --filter @causedeck/e2e lhci
      - name: Lighthouse CI (courts index and forum detail, signed in, seeded; performance and accessibility >= 0.95)
        if: ${{ !cancelled() }}
        run: |
          CHROME_PATH=$(find ~/.cache/ms-playwright -path '*chrome-linux*/chrome' -type f | head -n 1)
          export CHROME_PATH
          pnpm --filter @causedeck/e2e lhci:courts
      - name: Lighthouse CI (matters list and overview, signed in, seeded; performance and accessibility >= 0.95)
        if: ${{ !cancelled() }}
        run: |
          CHROME_PATH=$(find ~/.cache/ms-playwright -path '*chrome-linux*/chrome' -type f | head -n 1)
          export CHROME_PATH
          pnpm --filter @causedeck/e2e lhci:matters
      - name: Lighthouse CI (court-day board, signed in, seeded; JS <= 180 KB, interactive < 2.5 s)
        if: ${{ !cancelled() }}
        run: |
          CHROME_PATH=$(find ~/.cache/ms-playwright -path '*chrome-linux*/chrome' -type f | head -n 1)
          export CHROME_PATH
          pnpm --filter @causedeck/e2e lhci:court-day
      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: e2e/.lighthouseci
          # upload-artifact skips dot-directories by default; without this the reports never upload.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  flake:
    name: nightly flake check
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Start the Compose stack (Postgres, MinIO, Mailpit)
        run: bash infra/scripts/dev-up.sh
      - name: Pull the pinned Playwright image
        run: docker pull "$PLAYWRIGHT_IMAGE"
      # Every shipped smoke spec five times with no retries: any flake fails the run.
      - name: Playwright @smoke x5
        run: >-
          docker run --rm --network host --ipc host
          -e CI=true -e E2E_ASSERT_RESET_MS=2000
          -v "$GITHUB_WORKSPACE:/work" -w /work/e2e "$PLAYWRIGHT_IMAGE"
          node support/playwright.mjs --grep @smoke --repeat-each=5 --retries=0
          --fail-on-flaky-tests
      - name: Upload the HTML report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-flake-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 14

  update-snapshots:
    name: update visual baselines
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BASE: ${{ github.ref_name }}
      BRANCH: e2e-baselines/${{ github.run_id }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: ./.github/actions/setup
      - name: Start the Compose stack (Postgres, MinIO, Mailpit)
        run: bash infra/scripts/dev-up.sh
      - name: Pull the pinned Playwright image
        run: docker pull "$PLAYWRIGHT_IMAGE"
      # Baselines are only ever written here, in the pinned image: local OS fonts never leak in.
      - name: Regenerate @visual baselines
        run: >-
          docker run --rm --network host --ipc host
          -e CI=true
          -v "$GITHUB_WORKSPACE:/work" -w /work/e2e "$PLAYWRIGHT_IMAGE"
          node support/playwright.mjs --grep @visual --update-snapshots=all
      - name: Open a pull request with the new baselines
        run: |
          sudo chown -R "$(id -u):$(id -g)" e2e/__screenshots__
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all e2e/__screenshots__
          if git diff --cached --quiet; then
            echo 'Baselines unchanged.'
            exit 0
          fi
          git switch -c "$BRANCH"
          git commit -m 'test(e2e): update visual baselines'
          git push origin "HEAD:refs/heads/$BRANCH"
          gh pr create --base "$BASE" --head "$BRANCH" \
            --title 'test(e2e): update visual baselines' \
            --body "Regenerated by the E2E workflow (run $RUN_ID) in \`$PLAYWRIGHT_IMAGE\`."
