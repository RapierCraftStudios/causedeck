name: Images

# Production images and the compose smoke test (#97). Pull requests that touch the stack build the
# images for amd64, enforce the size budgets and boot the stack (infra/docker/test/compose-smoke.sh).
# Pushes to main also publish multi-arch images to GHCR tagged sha-<gitsha> and main, scan them with
# Trivy (critical with a fix fails), attach a CycloneDX SBOM and sign them with cosign (keyless).
# Tools run as pinned container images, like lint-workflows.yml, so no third-party action is needed.
#
# One-time repository variables (Settings > Variables), from the WAL-G release page:
#   WALG_SHA256_AMD64, WALG_SHA256_ARM64: sha256 of wal-g-pg-ubuntu-22.04-{amd64,aarch64}.

on:
  pull_request:
    paths:
      - 'infra/docker/**'
      - 'infra/scripts/**'
      - 'infra/caddy/**'
      - '.github/workflows/images.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_TAG: node:22.23.0-bookworm-slim
  PG_TAG: pgvector/pgvector:0.8.7-pg17
  WALG_VERSION: v3.0.5
  TRIVY_IMAGE: aquasec/trivy:0.58.1
  COSIGN_IMAGE: gcr.io/projectsigstore/cosign:v2.4.1
  BINFMT_IMAGE: tonistiiv/binfmt:qemu-v9.2.0

jobs:
  # Build every image for amd64, enforce the size budgets, then boot the stack and probe it.
  verify:
    name: Build, size gate and compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build context ignore file
        run: cp infra/docker/.dockerignore .dockerignore
      - name: Build images (amd64)
        env:
          WALG_SHA256_AMD64: ${{ vars.WALG_SHA256_AMD64 }}
        run: |
          set -euo pipefail
          org="${GITHUB_REPOSITORY_OWNER,,}"
          for svc in web api worker admin; do
            docker build --build-arg NODE_IMAGE="$NODE_TAG" \
              -f "infra/docker/$svc.Dockerfile" -t "ghcr.io/$org/causedeck-$svc:sha-$GITHUB_SHA" .
          done
          docker build --build-arg PG_IMAGE="$PG_TAG" --build-arg WALG_VERSION="$WALG_VERSION" \
            --build-arg TARGETARCH=amd64 --build-arg WALG_SHA256_AMD64="$WALG_SHA256_AMD64" \
            -f infra/docker/postgres/Dockerfile -t "ghcr.io/$org/causedeck-postgres:sha-$GITHUB_SHA" .
      - name: Image size budgets
        run: |
          set -euo pipefail
          org="${GITHUB_REPOSITORY_OWNER,,}"
          check() {
            local svc="$1" budget_mb="$2" bytes
            bytes="$(docker image inspect --format '{{.Size}}' "ghcr.io/$org/causedeck-$svc:sha-$GITHUB_SHA")"
            echo "$svc: $((bytes / 1000000)) MB (budget $budget_mb MB)"
            [ "$bytes" -le $((budget_mb * 1000000)) ] || { echo "::error::$svc image exceeds $budget_mb MB"; return 1; }
          }
          check web 350
          check admin 350
          check api 250
          check worker 250
      - name: Non-root check
        run: |
          set -euo pipefail
          org="${GITHUB_REPOSITORY_OWNER,,}"
          for svc in web api worker admin; do
            user="$(docker image inspect --format '{{.Config.User}}' "ghcr.io/$org/causedeck-$svc:sha-$GITHUB_SHA")"
            case "$user" in ''|0|0:*|root|root:*) echo "::error::$svc runs as root"; exit 1 ;; esac
          done
      - name: Caddy config validates and adapts
        run: |
          set -euo pipefail
          docker build -t causedeck-caddy:ci infra/caddy
          run() {
            docker run --rm -e DOMAIN=example.com -e ADMIN_ALLOWLIST=203.0.113.0/24 \
              -v "$PWD/infra/caddy:/etc/caddy:ro" causedeck-caddy:ci "$@"
          }
          run caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          run caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null
      - name: Compose config is valid
        env:
          IMAGE_ORG: acme
          GIT_SHA: ci
          DOMAIN: example.com
          CAUSEDECK_ENV_FILE: infra/docker/env/prod.env.example
          POSTGRES_PASSWORD: x
          OWNER_DB_PASSWORD: x
          APP_DB_PASSWORD: x
          S3_ACCESS_KEY: x
          S3_SECRET_KEY: x
        run: docker compose -f infra/docker/compose.prod.yml config -q
      - name: Compose smoke
        run: |
          IMAGE_ORG="${GITHUB_REPOSITORY_OWNER,,}" GIT_SHA="$GITHUB_SHA" \
            bash infra/docker/test/compose-smoke.sh

  # Main only: multi-arch build and push by sha tag, scan, SBOM and signature, then the `main` tag.
  publish:
    name: Publish ${{ matrix.svc }}
    needs: verify
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        svc: [web, api, worker, admin, postgres]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build context ignore file
        run: cp infra/docker/.dockerignore .dockerignore
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Enable arm64 emulation and buildx
        run: |
          set -euo pipefail
          docker run --privileged --rm "$BINFMT_IMAGE" --install arm64
          docker buildx create --name images --driver docker-container --use
      - name: Build and push by sha tag
        env:
          SVC: ${{ matrix.svc }}
          WALG_SHA256_AMD64: ${{ vars.WALG_SHA256_AMD64 }}
          WALG_SHA256_ARM64: ${{ vars.WALG_SHA256_ARM64 }}
        run: |
          set -euo pipefail
          org="${GITHUB_REPOSITORY_OWNER,,}"
          ref="ghcr.io/$org/causedeck-$SVC"
          if [ "$SVC" = postgres ]; then
            base="$PG_TAG"; file=infra/docker/postgres/Dockerfile; base_arg=PG_IMAGE
            extra=(--build-arg "WALG_VERSION=$WALG_VERSION" \
              --build-arg "WALG_SHA256_AMD64=$WALG_SHA256_AMD64" \
              --build-arg "WALG_SHA256_ARM64=$WALG_SHA256_ARM64")
          else
            base="$NODE_TAG"; file="infra/docker/$SVC.Dockerfile"; base_arg=NODE_IMAGE; extra=()
          fi
          # Pin the base by digest so the published image is reproducible (infra/docker/base/README.md).
          digest="$(docker buildx imagetools inspect "$base" --format '{{.Manifest.Digest}}')"
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg "$base_arg=${base%%:*}@$digest" "${extra[@]}" \
            --provenance=false --push --metadata-file "$RUNNER_TEMP/meta.json" \
            -f "$file" -t "$ref:sha-$GITHUB_SHA" .
          echo "REF=$ref" >>"$GITHUB_ENV"
          echo "DIGEST=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/meta.json")" >>"$GITHUB_ENV"
      - name: Trivy scan (critical with a fix fails) and SBOM
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          trivy() {
            docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD -v "$RUNNER_TEMP:/out" "$TRIVY_IMAGE" "$@"
          }
          trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 "$REF@$DIGEST"
          trivy image --format cyclonedx --output /out/sbom.cdx.json "$REF@$DIGEST"
      - name: Sign and attach SBOM (cosign keyless)
        run: |
          set -euo pipefail
          cosign() {
            docker run --rm \
              -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN -e GITHUB_ACTIONS \
              -v "$HOME/.docker/config.json:/root/.docker/config.json:ro" \
              -v "$RUNNER_TEMP:/out" "$COSIGN_IMAGE" "$@"
          }
          cosign sign --yes "$REF@$DIGEST"
          cosign attest --yes --type cyclonedx --predicate /out/sbom.cdx.json "$REF@$DIGEST"
      - name: Tag main
        run: docker buildx imagetools create -t "$REF:main" "$REF@$DIGEST"
