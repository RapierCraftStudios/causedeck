# Retrieval evaluation gate (#891, ADR 0051 §Evaluation): the baseline ranker on the pinned synthetic
# set. Fails when nDCG@10 drops more than 2 points below fixtures/research-eval/baseline.json.
# CI never sets RESEARCH_EVAL_PRIVATE_DIR; the advocate-written set is reported separately.
name: Research eval

on:
  pull_request:
    paths:
      - 'packages/intelligence/src/research/**'
      - 'packages/intelligence/src/corpus/**'
      - 'fixtures/research-eval/**'
      - '.github/workflows/research-eval.yml'

permissions:
  contents: read

concurrency:
  group: research-eval-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  research-eval:
    name: research-eval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: none
      - name: Evaluate retrieval
        run: pnpm --filter @causedeck/intelligence research-eval --out "$RUNNER_TEMP/research-eval"
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: research-eval-report
          path: ${{ runner.temp }}/research-eval/
          if-no-files-found: ignore
          retention-days: 14
