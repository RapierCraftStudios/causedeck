# Dependency audit, secret scan and static analysis. Needs no repository secrets.
name: Security

on:
  pull_request:
  push:
    branches: [main, staging, 'milestone/**']
  schedule:
    - cron: '30 2 * * 1' # Mondays 02:30 UTC (08:00 IST)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fails on a high or critical advisory in production dependencies.
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: pnpm audit (production, high and above)
        run: pnpm audit:prod

  # The gitleaks CLI image, pinned by digest. gitleaks/gitleaks-action needs a GITLEAKS_LICENSE
  # secret for organisation repositories, which would break secret-free runs.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan git history for secrets
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --verbose --exit-code 1 /repo

  # Code scanning on a private repository needs GitHub Advanced Security (docs/engineering/ci.md).
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # actions: read lets the CodeQL action read this workflow run (private repositories).
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:javascript-typescript

  dependency-review:
    name: dependency-review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
