# Marketing site (apps/site, #89): build, lint, test, Lighthouse CI, Playwright (smoke, axe, visual)
# and the Cloudflare Pages deploy. The site is a static export with no tenant data and no secrets;
# only the deploy job needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and it skips cleanly
# when they are absent (forks, or before #107 provides them).
name: Site

on:
  pull_request:
    paths:
      - 'apps/site/**'
      - 'packages/ui/**'
      - 'packages/config/**'
      - 'e2e/site/**'
      - 'e2e/playwright.site.config.ts'
      - '.github/workflows/site.yml'
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'packages/ui/**'
      - 'packages/config/**'
      - 'e2e/site/**'
      - 'e2e/playwright.site.config.ts'
      - '.github/workflows/site.yml'
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate the header, footer and 404 visual baselines in the pinned image and upload them as an artifact
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in step with e2e.yml (same pinned image, so baselines match the `@playwright/test` catalog version).
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  build:
    name: site build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The build runs the Rule 36 lint first and fails on denylisted copy or invalid frontmatter.
      - name: Lint, typecheck and test
        run: pnpm turbo run lint typecheck test --filter=@causedeck/site
      # The build fails while a legal page is still `status: draft` (scripts/legal-status.ts).
      # ALLOW_DRAFT_LEGAL=1 is set for every build except `main` (production), so staging and PR
      # previews build with drafts. It is passed directly because turbo's strict env mode drops it.
      - name: Build
        env:
          ALLOW_DRAFT_LEGAL: ${{ github.ref_name == 'main' && '0' || '1' }}
        run: pnpm --filter @causedeck/site build
      - name: Upload the static export
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-out
          path: apps/site/out
          retention-days: 7

  lighthouse:
    name: site lighthouse
    needs: build
    if: ${{ !inputs.update_snapshots }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Download the static export
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-out
          path: apps/site/out
      # Budgets and the 0.95 category floors are in apps/site/lighthouserc.json.
      - name: Lighthouse CI
        working-directory: apps/site
        run: ../../e2e/node_modules/.bin/lhci autorun --config=lighthouserc.json

  e2e:
    name: site e2e
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Download the static export
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-out
          path: apps/site/out
      - name: Pull the pinned Playwright image
        run: docker pull "$PLAYWRIGHT_IMAGE"
      # No database or Compose stack: the specs serve apps/site/out (e2e/site/static-server.mjs).
      - name: Playwright (smoke, axe, visual)
        env:
          UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots }}
        run: |
          extra=()
          if [ "$UPDATE_SNAPSHOTS" = "true" ]; then extra+=(--update-snapshots); fi
          docker run --rm --network host --ipc host -e CI=true \
            -v "$GITHUB_WORKSPACE:/work" -w /work/e2e "$PLAYWRIGHT_IMAGE" \
            node_modules/.bin/playwright test -c playwright.site.config.ts "${extra[@]}"
      - name: Upload the report and test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-playwright-results
          path: |
            e2e/playwright-report-site
            e2e/test-results-site
          if-no-files-found: ignore
          retention-days: 14
      # Commit these under e2e/site/__screenshots__ (never generate baselines on a dev machine).
      - name: Upload regenerated baselines
        if: ${{ inputs.update_snapshots }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-visual-baselines
          path: e2e/site/__screenshots__
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: site deploy
    needs: [build, e2e]
    if: ${{ !inputs.update_snapshots && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Absent in forks and until #107 provides them: the deploy step is then skipped, not failed.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'causedeck-site' }}
      # `main` is production; every PR gets its own preview URL.
      PAGES_BRANCH: ${{ github.event_name == 'push' && 'main' || format('pr-{0}', github.event.pull_request.number) }}
    steps:
      - name: Skip without Cloudflare credentials
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping the deploy."
      - name: Download the static export
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-out
          path: out
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx --yes wrangler@4.152.0 pages deploy out --project-name="$PAGES_PROJECT" --branch="$PAGES_BRANCH" --commit-dirty=true
