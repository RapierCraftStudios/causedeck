# Storybook for packages/ui (#129): build it, run every story as a test (play-function interactions
# plus axe in light and dark, via @storybook/addon-vitest) with the reduced-motion browser tests,
# enforce the story and bundle checks, and publish the static Storybook as an artifact. The `visual`
# job (#134) screenshots every story in light and dark at 360/768/1280 inside the pinned Playwright
# image and compares against packages/ui/visual/__screenshots__ (refresh them with the
# `visual:update` label, see .github/workflows/visual-update.yml).
name: Storybook

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'packages/ui/**'
      - 'packages/config/tailwind/**'
      - 'packages/config/eslint/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/storybook.yml'
  push:
    branches: [main, staging]
    paths:
      - 'packages/ui/**'
      - 'packages/config/tailwind/**'
      - 'packages/config/eslint/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/storybook.yml'
  schedule:
    - cron: '0 21 * * *' # nightly 02:30 IST: visual regression report
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  storybook:
    name: storybook
    if: ${{ (github.event.action != 'labeled' || github.event.label.name == 'full-ci') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install Chromium for Vitest browser mode
        run: pnpm --filter @causedeck/ui exec playwright install --with-deps chromium
      - name: Check every component has its stories
        run: pnpm --filter @causedeck/ui check:stories
      - name: Bundle size budget
        run: pnpm --filter @causedeck/ui check:bundle
      - name: Build Storybook
        run: pnpm --filter @causedeck/ui build-storybook
      - name: Interaction, axe (light and dark) and reduced-motion tests
        run: pnpm --filter @causedeck/ui test:storybook
      - name: Upload Storybook
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-static
          path: packages/ui/storybook-static
          if-no-files-found: error
          retention-days: 14

  visual:
    name: visual (${{ matrix.shard }}/4)
    # Full tier only (docs/engineering/ci.md): ship PRs, staging/main pushes, or the `full-ci` label.
    # Report-only (D-045): nightly, manual dispatch, or a PR labelled full-ci. Not a ship gate.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (contains(github.event.pull_request.labels.*.name, 'full-ci') && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')) }}
    continue-on-error: true
    runs-on: ubuntu-latest
    # ~4,500 screenshots (every story x light/dark x 360/768/1280): sharded 4 ways so a shard takes
    # ~10-12 min on a 2-vCPU runner instead of one 45-min job (D-044).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Pinned Playwright image (Linux Chromium and fonts): the only place baselines are compared and
    # generated. Keep the tag in step with the `playwright` catalog version.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The container user does not own the checkout, so git (run by the root `prepare` script's
      # `lefthook install`) refuses the repository as dubious ownership without this.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/setup
      - name: Build Storybook
        run: pnpm --filter @causedeck/ui build-storybook
      - name: Visual regression (every story, light and dark, 360/768/1280)
        run: pnpm --filter @causedeck/ui test:visual -- --shard=${{ matrix.shard }}/4
      - name: Upload expected, actual and diff images
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diffs-${{ matrix.shard }}
          path: |
            packages/ui/visual/test-results
            packages/ui/visual/playwright-report
          if-no-files-found: ignore
          retention-days: 14
