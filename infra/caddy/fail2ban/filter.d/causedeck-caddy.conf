# Matches Caddy JSON access-log lines with status 401 or 429 as stored by Docker's json-file
# driver ({"log":"{...}\n",...}); the client address is request.client_ip. Install on the host:
# see infra/caddy/README.md.
[Definition]
failregex = ^\{"log":"\{.*\\"logger\\":\\"http\.log\.access[^"\\]*\\".*\\"client_ip\\":\\"<HOST>\\".*\\"status\\":(?:401|429)[,}]
ignoreregex =
