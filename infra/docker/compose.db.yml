# Stage B database tier on rented OVH Mumbai servers (#887, ADR 0053 and the D-037 amendment):
# a Postgres primary and a streaming replica, each behind its own PgBouncer, each on its own VPS.
# Same image, config and WAL-G archiving as the Stage A postgres service in compose.prod.yml.
#
#   primary box:  docker compose -f compose.db.yml --env-file /etc/causedeck/db.env --profile primary up -d --wait
#   replica box:  docker compose -f compose.db.yml --env-file /etc/causedeck/db.env --profile replica up -d --wait
#
# Rules this file keeps (asserted by infra/scripts/compose-db.test.mjs):
#   - the primary archives WAL to the Hyderabad bucket (#884) through WAL-G; the replica only
#     streams from the primary (primary_conninfo + a physical slot) and never archives;
#   - the replica is read-only: hot_standby on, default_transaction_read_only on, standby.signal
#     written by pg_basebackup -R;
#   - apps connect to PgBouncer (6432, transaction pooling) with sslmode=require; Postgres (5432) is
#     published only for replication and is limited to the replica's IP by the host firewall;
#   - ports bind to DB_BIND_ADDR (the node's private or public address, never 0.0.0.0) and the host
#     firewall (infra/scripts/bootstrap-vps.sh) opens 5432 and 6432 to the app and replica nodes only;
#   - cap_drop ALL, no-new-privileges, read-only root filesystem, limits and a restart policy.
# No secrets live here: they come from the env file (env/db.env.example) and the WAL-G key file.
name: causedeck-db

networks:
  db:

secrets:
  walg_key:
    file: ${WALG_KEY_FILE:-/dev/null}

volumes:
  pgdata_primary:
  pgdata_replica:

services:
  postgres-primary:
    image: ghcr.io/${IMAGE_ORG:?set IMAGE_ORG}/causedeck-postgres:sha-${GIT_SHA:?set GIT_SHA}
    profiles: [primary]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    user: postgres
    # postgresql.conf already sets wal_level = replica, archive_mode = on and
    # archive_command = 'wal-g wal-push %p'; the flags add what streaming replication needs.
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - wal_keep_size=2GB
      - -c
      - hot_standby=on
    environment:
      TZ: UTC
      POSTGRES_USER: causedeck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: causedeck
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?set REPLICATION_PASSWORD}
      # WAL-G archive target: the Hyderabad (ap-south-2) bucket, never a local default.
      WALG_S3_PREFIX: ${WALG_S3_PREFIX:?set WALG_S3_PREFIX}
      AWS_ENDPOINT: ${WALG_AWS_ENDPOINT:?set WALG_AWS_ENDPOINT}
      AWS_ACCESS_KEY_ID: ${WALG_ARCHIVE_ACCESS_KEY:?set WALG_ARCHIVE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${WALG_ARCHIVE_SECRET_KEY:?set WALG_ARCHIVE_SECRET_KEY}
      AWS_S3_FORCE_PATH_STYLE: 'true'
      AWS_REGION: ${WALG_AWS_REGION:-ap-south-2}
      WALG_LIBSODIUM_KEY_PATH: /run/secrets/walg_key
      WALG_LIBSODIUM_KEY_TRANSFORM: hex
    secrets: [walg_key]
    volumes:
      - pgdata_primary:/var/lib/postgresql/data
      - ./postgres/pg_hba.stage-b.conf:/etc/postgresql/pg_hba.conf:ro
    tmpfs:
      - /tmp
      - /var/run/postgresql:mode=1777
    shm_size: 512mb
    ports:
      - '${DB_BIND_ADDR:?set DB_BIND_ADDR}:5432:5432'
    networks: [db]
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEM:-16g}
          cpus: '${POSTGRES_CPUS:-6.0}'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U causedeck -d causedeck']
      interval: 5s
      timeout: 5s
      retries: 30
    stop_grace_period: 60s
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

  pgbouncer-primary:
    image: edoburu/pgbouncer:v1.24.1-p1
    profiles: [primary]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    environment:
      TZ: UTC
      DB_HOST: postgres-primary
      DB_PORT: '5432'
      DB_NAME: '*'
      DB_USER: causedeck_app
      DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      LISTEN_PORT: '6432'
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-400}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_POOL_SIZE:-40}
      MAX_PREPARED_STATEMENTS: '100'
      SERVER_TLS_SSLMODE: require
      CLIENT_TLS_SSLMODE: require
      CLIENT_TLS_KEY_FILE: /etc/pgbouncer-tls/server.key
      CLIENT_TLS_CERT_FILE: /etc/pgbouncer-tls/server.crt
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    # Host directory with server.key (0640, readable by the container user) and server.crt; made by
    # the runbook's openssl step, or replaced by a CA-issued certificate.
    volumes:
      - ${PGBOUNCER_TLS_DIR:-/etc/causedeck/pgbouncer-tls}:/etc/pgbouncer-tls:ro
    tmpfs:
      - /tmp
      - /etc/pgbouncer:mode=1777
    ports:
      - '${DB_BIND_ADDR:?set DB_BIND_ADDR}:6432:6432'
    networks: [db]
    depends_on:
      postgres-primary:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 6432']
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging

  # Streaming replica. First start (empty volume): pg_basebackup from the primary with -R, which
  # writes standby.signal and primary_conninfo, and creates the physical slot; later starts just run.
  postgres-replica:
    image: ghcr.io/${IMAGE_ORG:?set IMAGE_ORG}/causedeck-postgres:sha-${GIT_SHA:?set GIT_SHA}
    profiles: [replica]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    user: postgres
    entrypoint: ['sh', '/usr/local/bin/replica-entrypoint.sh']
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - hot_standby=on
      - -c
      - default_transaction_read_only=on
      - -c
      - primary_conninfo=host=${PRIMARY_HOST:?set PRIMARY_HOST} port=5432 user=replicator sslmode=require application_name=replica1
      - -c
      - primary_slot_name=replica1
      - -c
      - hot_standby_feedback=on
    environment:
      TZ: UTC
      PRIMARY_HOST: ${PRIMARY_HOST:?set PRIMARY_HOST}
      PGPASSWORD: ${REPLICATION_PASSWORD:?set REPLICATION_PASSWORD}
      PGSSLMODE: require
      REPLICA_SLOT: replica1
    volumes:
      - pgdata_replica:/var/lib/postgresql/data
      - ./postgres/pg_hba.stage-b.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    tmpfs:
      - /tmp
      - /var/run/postgresql:mode=1777
    shm_size: 512mb
    ports:
      - '${DB_BIND_ADDR:?set DB_BIND_ADDR}:5432:5432'
    networks: [db]
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEM:-16g}
          cpus: '${POSTGRES_CPUS:-6.0}'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U causedeck -d causedeck']
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s
    stop_grace_period: 60s
    logging: *logging

  pgbouncer-replica:
    image: edoburu/pgbouncer:v1.24.1-p1
    profiles: [replica]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    environment:
      TZ: UTC
      DB_HOST: postgres-replica
      DB_PORT: '5432'
      DB_NAME: '*'
      DB_USER: causedeck_app
      DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      LISTEN_PORT: '6432'
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-400}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_POOL_SIZE:-40}
      MAX_PREPARED_STATEMENTS: '100'
      SERVER_TLS_SSLMODE: require
      CLIENT_TLS_SSLMODE: require
      CLIENT_TLS_KEY_FILE: /etc/pgbouncer-tls/server.key
      CLIENT_TLS_CERT_FILE: /etc/pgbouncer-tls/server.crt
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    # Host directory with server.key (0640, readable by the container user) and server.crt; made by
    # the runbook's openssl step, or replaced by a CA-issued certificate.
    volumes:
      - ${PGBOUNCER_TLS_DIR:-/etc/causedeck/pgbouncer-tls}:/etc/pgbouncer-tls:ro
    tmpfs:
      - /tmp
      - /etc/pgbouncer:mode=1777
    ports:
      - '${DB_BIND_ADDR:?set DB_BIND_ADDR}:6432:6432'
    networks: [db]
    depends_on:
      postgres-replica:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 6432']
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging
