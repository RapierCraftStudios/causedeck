# Local development stack: `pnpm stack:up` (infra/scripts/dev-up.sh). See infra/docker/README.md.
# Credentials here are local-only dev defaults; never reuse them in staging or production.
# Every image is pinned (no `latest`) and every port binds to 127.0.0.1 only.
name: causedeck-dev

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: causedeck
      POSTGRES_PASSWORD: causedeck
      POSTGRES_DB: causedeck
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on a fresh volume: extensions, then the owner and app roles.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    shm_size: 256mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U causedeck -d causedeck']
      interval: 2s
      timeout: 5s
      retries: 30

  # The official minio/minio and minio/mc images are no longer published, so this uses the
  # community-maintained builds of the same MinIO server and client (pgsty/minio, pgsty/mc).
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/live']
      interval: 2s
      timeout: 5s
      retries: 30

  # One-shot: creates the dev bucket with versioning. Idempotent; dev-up.sh runs it after --wait.
  minio-init:
    image: pgsty/mc:RELEASE.2026-10-18T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/causedeck-dev &&
        mc version enable local/causedeck-dev
    profiles: [init]

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  miniodata:
