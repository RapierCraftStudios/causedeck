# pg_hba.conf for the Stage B database nodes (compose.db.yml, #887). TLS and SCRAM everywhere; no
# trust and no plain host lines. Reachability is limited by the host firewall (ufw allows 5432 and
# 6432 from the app and replica node IPs only, infra/runbooks/stage-b-scale-out.md), so these rules
# do not repeat an address list.
local   all           all                                     peer
# Streaming replication from the replica node (role created by init/03-replicator.sh).
hostssl replication   replicator    0.0.0.0/0                 scram-sha-256
hostssl replication   replicator    ::/0                      scram-sha-256
# PgBouncer and the app tier. The owner role is for migrations from the deploy host.
hostssl all           causedeck_app    0.0.0.0/0              scram-sha-256
hostssl all           causedeck_app    ::/0                   scram-sha-256
hostssl all           causedeck_owner  0.0.0.0/0              scram-sha-256
hostssl all           causedeck_owner  ::/0                   scram-sha-256
hostssl all           causedeck        0.0.0.0/0              scram-sha-256
hostssl all           causedeck        ::/0                   scram-sha-256
