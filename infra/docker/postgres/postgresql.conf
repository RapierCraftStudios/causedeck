# Production postgresql.conf (#97). Sized for the 4 vCPU / 8 GB Stage A VPS shared with the app tier
# (postgres container limit: 3 GB; see infra/docker/README.md).
listen_addresses = '*'               # private compose network only; nothing publishes 5432
max_connections = 100
shared_buffers = 768MB
effective_cache_size = 2GB
work_mem = 8MB
maintenance_work_mem = 192MB

# Clocks and logs are UTC.
timezone = 'UTC'
log_timezone = 'UTC'

# TLS between the app tier and Postgres. The image generates the certificate.
ssl = on
ssl_cert_file = '/etc/postgresql/tls/server.crt'
ssl_key_file = '/etc/postgresql/tls/server.key'
ssl_min_protocol_version = 'TLSv1.3'

# Continuous WAL archiving through WAL-G. The storage target and credentials come from the
# container environment (WALG_S3_PREFIX, AWS_ENDPOINT, AWS_ACCESS_KEY_ID, ...); CI defaults to the
# local MinIO bucket. Restore drills and retention are #101.
wal_level = replica
archive_mode = on
archive_timeout = 60
archive_command = 'wal-g wal-push %p'

# Logging policy: never log statement text (it carries matter data); log slow queries by duration
# only, plus connection problems and lock waits.
log_statement = 'none'
log_min_duration_statement = 1000
log_min_error_statement = panic
log_connections = on
log_disconnections = on
log_lock_waits = on
log_line_prefix = '%m [%p] %q%u@%d '
