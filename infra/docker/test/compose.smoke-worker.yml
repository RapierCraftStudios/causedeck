# Smoke-only override (#1161): the worker exits without DATABASE_URL_OWNER (it owns the pgboss
# schema), and compose.prod.yml withholds it from app services. Until #1161 decides between owner
# credentials for the worker and pg-boss via migrate, the smoke gives its throwaway worker the owner
# URL so the rest of the stack is still verified. sslmode=no-verify: pg-boss uses node-postgres, which
# treats sslmode=require as verify-full and rejects the self-signed Postgres cert (also #1161).
# Never use this file outside the compose smoke.
services:
  worker:
    environment:
      DATABASE_URL_OWNER: postgres://causedeck_owner:${OWNER_DB_PASSWORD:?set OWNER_DB_PASSWORD}@postgres:5432/causedeck?sslmode=no-verify
