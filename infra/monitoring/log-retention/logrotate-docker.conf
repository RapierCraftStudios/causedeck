# Daily gzip of Docker JSON logs for the lean log path (#886). Install with:
#   install -m 0644 logrotate-docker.conf /etc/logrotate.d/causedeck-docker
# The monitoring compose file keeps Docker's own size rotation (10m x 3), which would drop lines
# on a busy day; for hosts on the `core` profile raise it in /etc/docker/daemon.json
# ("log-opts": {"max-size": "100m", "max-file": "3"}) so a day fits one file.
# copytruncate: Docker keeps the file descriptor open. Rotated files (<id>-json.log-YYYYMMDD.gz)
# are uploaded and deleted by archive-logs.sh; `rotate 7` is the local safety net if uploads fail.
/var/lib/docker/containers/*/*-json.log {
    daily
    rotate 7
    dateext
    dateformat -%Y%m%d
    compress
    copytruncate
    missingok
    notifempty
    nocreate
    su root root
}
