# Loki (#102). Logs are CERT-In evidence: retained at least 180 days (4320h) in India, documented
# default 200 days (4800h). Storage is MinIO on the VPS or S3 ap-south-1; the endpoint is validated
# by test/config.test.ts. Deletion is only by the retention compactor: the delete API is disabled.
# Env is expanded (-config.expand-env=true).
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    s3:
      endpoint: ${LOKI_S3_ENDPOINT}
      bucketnames: ${LOKI_S3_BUCKET}
      region: ap-south-1
      access_key_id: ${LOKI_S3_ACCESS_KEY}
      secret_access_key: ${LOKI_S3_SECRET_KEY}
      s3forcepathstyle: true
      insecure: true

schema_config:
  configs:
    - from: '2026-01-01'
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: s3

limits_config:
  retention_period: 4800h
  # No per-request deletion: only the retention compactor removes data, and never before 4320h.
  deletion_mode: disabled
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: true
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16

analytics:
  reporting_enabled: false
