# Prometheus, `core` profile (#886). Same as prometheus.yml minus Loki and the collector: services push
# OTLP straight to Prometheus (--web.enable-otlp-receiver); host, container and probe exporters are
# scraped directly. Times are UTC; court-day windows are computed
# in rules/court-day.yml (IST = UTC+5:30).
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    stack: causedeck
    region: ap-south-1

# OTLP metrics pushed by the services keep the names the collector's exporter produced
# (http_server_duration_milliseconds_bucket, causedeck_*), so every rule evaluates unchanged.
otlp:
  promote_resource_attributes: [service.name, service.instance.id, deployment.environment.name]

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']
  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
  # Internal /readyz of each service (private network, no TLS).
  - job_name: blackbox-readyz
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://web:3000/readyz', 'http://api:3001/readyz', 'http://worker:3003/readyz']
    relabel_configs: &probe_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  # Public endpoints: app, api, static, site and status. Edit targets/public.yml at deploy.
  - job_name: blackbox-public
    metrics_path: /probe
    params:
      module: [http_2xx_tls]
    file_sd_configs:
      - files: ['/etc/prometheus/targets/public.yml']
    relabel_configs: *probe_relabel
