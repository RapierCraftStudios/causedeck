# Alert rules (#102). Severity routes in alertmanager.yml: page (P0), ticket (P1/P2 follow-up),
# info. `priority` is P0 or P1 and selects the on-call route. Metric names:
#   http_server_duration_milliseconds_*   OTel HTTP server histogram (packages/observability)
#   causedeck_queue_lag_seconds, causedeck_queue_dead_letter_total   worker queues
#   walg_last_archive_age_seconds, walg_last_backup_age_seconds, walg_backup_last_ok,
#   minio_replication_last_ok, restore_drill_* , backup_health_*      backups (#101, #792)
#   adapter_parse_success_ratio, adapter_last_success_timestamp        court adapters
groups:
  - name: availability
    rules:
      - alert: ServiceDown
        expr: up{job=~"otel-collector|cadvisor|node|loki|alertmanager"} == 0
        for: 5m
        labels: { severity: page, priority: P0 }
        annotations:
          summary: '{{ $labels.job }} has been down for 5 minutes'
      - alert: ReadyzFailing
        expr: probe_success{job="blackbox-readyz"} == 0
        for: 2m
        labels: { severity: page, priority: P0 }
        annotations:
          summary: '{{ $labels.instance }} is failing /readyz'
      - alert: PublicEndpointDown
        expr: probe_success{job="blackbox-public"} == 0
        for: 3m
        labels: { severity: page, priority: P0 }
        annotations:
          summary: '{{ $labels.instance }} is unreachable from the probe'
      - alert: CertificateExpiringSoon
        expr: probe_ssl_earliest_cert_expiry{job="blackbox-public"} - time() < 14 * 86400
        for: 1h
        labels: { severity: ticket, priority: P1 }
        annotations:
          summary: 'Certificate for {{ $labels.instance }} expires in under 14 days'
  - name: performance
    rules:
      - alert: ApiLatencyP95High
        expr: >-
          histogram_quantile(0.95, sum by (le) (rate(http_server_duration_milliseconds_bucket[5m]))) > 400
        for: 10m
        labels: { severity: ticket, priority: P1 }
        annotations:
          summary: 'p95 request latency above 400 ms for 10 minutes'
      - alert: ErrorRateSpike
        expr: >-
          sum(rate(http_server_duration_milliseconds_count{http_response_status_code=~"5.."}[5m]))
          / sum(rate(http_server_duration_milliseconds_count[5m])) > 0.05
        for: 5m
        labels: { severity: page, priority: P1 }
        annotations:
          summary: '5xx responses above 5% of requests'
      - alert: DatabaseCpuHigh
        expr: >-
          sum(rate(container_cpu_usage_seconds_total{name=~".*postgres.*"}[5m]))
          / (sum(container_spec_cpu_quota{name=~".*postgres.*"}) / sum(container_spec_cpu_period{name=~".*postgres.*"}))
          > 0.6
        for: 15m
        labels: { severity: ticket, priority: P1 }
        annotations:
          summary: 'Postgres CPU above 60% of its limit for 15 minutes'
  - name: capacity
    rules:
      - alert: DiskUsageHigh
        expr: >-
          1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) > 0.8
        for: 10m
        labels: { severity: ticket, priority: P1 }
        annotations:
          summary: 'Disk {{ $labels.mountpoint }} above 80%'
  - name: queues
    rules:
      - alert: QueueLagHigh
        expr: max by (queue) (causedeck_queue_lag_seconds) > 300
        for: 10m
        labels: { severity: ticket, priority: P1 }
        annotations:
          summary: 'Queue {{ $labels.queue }} lag above 5 minutes'
      - alert: DeadLetterGrowth
        expr: sum by (queue) (increase(causedeck_queue_dead_letter_total[15m])) > 5
        labels: { severity: ticket, priority: P1 }
        annotations:
          summary: 'Dead-letter queue {{ $labels.queue }} grew by more than 5 in 15 minutes'
  # R9 (#792): a failed backup, stale WAL or failed drill alerts within 10 minutes. Signals come
  # from the `system.backup.health` job (packages/core/src/jobs/definitions/backup-health.ts), which
  # runs every minute and exports the gauges below through the OTel collector (names are as emitted,
  # no prefix). Worst-case detection budget for a failure that already exists: job pass 60 s +
  # OTLP export 60 s + scrape 30 s + rule evaluation 30 s + `for: 1m` + Alertmanager group_wait
  # 10 s is about 4.5 min, so even the 5-minute WAL threshold pages by minute 10. `for` must stay
  # at 2m or less in this group (test/alerts.test.ts enforces it). Sentinel -1 means a report is
  # missing; it counts as breach. Aggregates use max/min because two worker replicas exist.
  - name: backups
    rules:
      - alert: BackupWalStale
        expr: max(walg_last_archive_age_seconds) > 300 or max(walg_last_archive_age_seconds) < 0
        for: 1m
        labels: { severity: page, priority: P0 }
        annotations:
          summary: 'Newest archived WAL segment is older than 5 minutes'
      - alert: BackupFailed
        expr: min(walg_backup_last_ok) == 0
        for: 1m
        labels: { severity: page, priority: P0 }
        annotations:
          summary: 'The last base backup run failed'
      - alert: BackupBaseStale
        expr: >-
          max(walg_last_backup_age_seconds) > 26 * 3600 or max(walg_last_backup_age_seconds) < 0
        for: 1m
        labels: { severity: page, priority: P1 }
        annotations:
          summary: 'Newest base backup is older than 26 hours'
      - alert: BackupReplicationFailed
        expr: min(minio_replication_last_ok) == 0
        for: 1m
        labels: { severity: page, priority: P1 }
        annotations:
          summary: 'The last off-host replication run failed'
      - alert: RestoreDrillFailed
        expr: min(restore_drill_last_ok) == 0
        for: 1m
        labels: { severity: page, priority: P1 }
        annotations:
          summary: 'The last automated restore drill failed'
      - alert: RestoreDrillTargetBreach
        expr: max(restore_drill_rto_seconds) > 14400 or max(restore_drill_rpo_seconds) > 900
        for: 1m
        labels: { severity: page, priority: P1 }
        annotations:
          summary: 'The last restore drill breached the RTO (4 h) or RPO (15 min) target'
      - alert: RestoreDrillStale
        expr: time() - max(restore_drill_last_success_timestamp) > 8 * 86400
        for: 1m
        labels: { severity: page, priority: P1 }
        annotations:
          summary: 'No successful restore drill in the last 8 days'
      - alert: BackupHealthJobSilent
        expr: >-
          time() - max(backup_health_last_run_timestamp) > 300
          or absent(backup_health_last_run_timestamp)
        for: 2m
        labels: { severity: page, priority: P1 }
        annotations:
          summary: 'system.backup.health has not reported for 5 minutes: backups are unmonitored'
  - name: time
    rules:
      # CERT-In requires accurate timestamps: the host clock must stay within 1 s of NTP.
      - alert: ClockDriftHigh
        expr: abs(node_timex_offset_seconds) > 1
        for: 2m
        labels: { severity: page, priority: P1 }
        annotations:
          summary: 'Host clock offset above 1 s'
      - alert: NtpNotSynchronised
        expr: node_timex_sync_status == 0
        for: 15m
        labels: { severity: ticket, priority: P1 }
        annotations:
          summary: 'Host clock is not NTP-synchronised'
  - name: adapters
    rules:
      - alert: AdapterParseRatioLow
        expr: adapter_parse_success_ratio < 0.9
        for: 30m
        labels: { severity: ticket, priority: P1 }
        annotations:
          summary: 'Adapter {{ $labels.adapter }} parse success below 90%'
      - alert: AdapterStale
        expr: time() - adapter_last_success_timestamp > 6 * 3600
        labels: { severity: ticket, priority: P1 }
        annotations:
          summary: 'Adapter {{ $labels.adapter }} has not succeeded for 6 hours'
