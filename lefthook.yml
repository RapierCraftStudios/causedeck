# Git hooks (installed by `pnpm install` through the root `prepare` script).
pre-commit:
  parallel: true
  commands:
    prettier:
      glob: '*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,json,md,yml,yaml,css}'
      run: pnpm exec prettier --check --ignore-unknown {staged_files}
    eslint:
      glob: '*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}'
      exclude:
        - 'packages/config/eslint/__fixtures__/**'
      run: pnpm exec eslint --no-warn-ignored --max-warnings 0 {staged_files}

    # Secret scan of the staged diff (#104), with the same config as CI. Uses the gitleaks binary or the
    # digest-pinned image CI uses; with neither, it says so and CI still scans.
    gitleaks:
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks git --staged --redact --no-banner --config .gitleaks.toml
        elif command -v docker >/dev/null 2>&1; then
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --staged --redact --no-banner /repo
        else
          echo 'gitleaks: neither gitleaks nor docker is installed; skipping (CI scans every PR)'
        fi

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
