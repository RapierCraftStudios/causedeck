packages:
  - apps/*
  - packages/*
  - e2e

# Supply-chain guard: only resolve versions published at least 3 days ago (minutes).
minimumReleaseAge: 4320

# Install scripts: esbuild (Vitest) and unrs-resolver (ESLint import resolution) may run theirs.
# Lefthook's postinstall is skipped on purpose; the root `prepare` script installs the hooks.
# @parcel/watcher (via @tailwindcss/cli) ships prebuilt platform packages, so its script is skipped.
# protobufjs (via OpenTelemetry exporters and Testcontainers) only runs a version-check postinstall;
# skip it. Testcontainers' optional native SSH bindings (cpu-features, ssh2) are skipped too: the
# pure-JS fallbacks are enough for the local Docker socket.
# `allowBuilds` is read by pnpm >= 10.26; the two lists cover older pnpm 10 releases.
allowBuilds:
  esbuild: 0.28.2
  unrs-resolver: true
  lefthook: false
  '@parcel/watcher': false
  cpu-features: false
  protobufjs: false
  ssh2: false
onlyBuiltDependencies:
  - esbuild
  - unrs-resolver
ignoredBuiltDependencies:
  - '@parcel/watcher'
  - cpu-features
  - lefthook
  - protobufjs
  - ssh2

# Security overrides for transitive advisories (`pnpm audit:prod`). handlebars (via
# eslint-plugin-boundaries) takes the 4.7.10 patch. tinypool (vitest 3, pulled into the web graph as
# better-auth's optional `vitest` peer) takes the 2.1.2 patch; 2.x only drops Node 18 (.nvmrc is 22).
overrides:
  handlebars@<4.7.10: 4.7.10
  vitest>tinypool: ^2.1.2

# No patched braces release exists for GHSA-vfj7-8cjw-p6xm (stack-exhaustion DoS on deeply nested
# patterns). Its only production path is next-intl > @parcel/watcher > micromatch, which only gets
# patterns from our own config, never from user input. Drop this once braces ships a fix.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

