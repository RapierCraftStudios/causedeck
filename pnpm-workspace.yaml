packages:
  - apps/*
  - packages/*
  - e2e

# Supply-chain guard: only resolve versions published at least 3 days ago (minutes).
minimumReleaseAge: 4320

# Install scripts: esbuild (Vitest) and unrs-resolver (ESLint import resolution) may run theirs.
# Lefthook's postinstall is skipped on purpose; the root `prepare` script installs the hooks.
# Testcontainers' optional native SSH bindings (cpu-features, ssh2) and protobufjs's postinstall are
# skipped: the pure-JS fallbacks are enough for the local Docker socket.
# `allowBuilds` is read by pnpm >= 10.26; the two lists cover older pnpm 10 releases.
allowBuilds:
  esbuild: true
  unrs-resolver: true
  lefthook: false
  cpu-features: false
  protobufjs: false
  ssh2: false
onlyBuiltDependencies:
  - esbuild
  - unrs-resolver
ignoredBuiltDependencies:
  - cpu-features
  - lefthook
  - protobufjs
  - ssh2

